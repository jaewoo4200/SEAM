name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    # Pinned image: ubuntu-latest moves to a new Ubuntu release on its own
    # schedule; bump this deliberately after a green run on the new image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported interpreter + the everyday dev interpreter.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend (dev + parquet extras)
        id: install
        # parquet = pyarrow, so the AODT and parquet-dataset tests run here
        # instead of skipping.
        run: pip install -e "backend[dev,parquet]"
      - name: "Lint: ruff check backend"
        run: ruff check backend
      - name: Sionna RT must run here (Dr.Jit LLVM on the runner)
        # The live-Sionna tests skip when the runtime probe fails; this step
        # turns a runner that lost its LLVM backend into a red job instead.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          python -c "from seam_studio.services import availability as a;
          print(a.sionna_runtime());
          assert a.sionna_available(), a.sionna_unavailable_reason() or 'sionna-rt not installed'"
      - name: Backend tests
        # Run even when lint failed, so one push reports both.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest backend/tests -rs

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Typecheck + build
        run: npm run build
        working-directory: frontend
